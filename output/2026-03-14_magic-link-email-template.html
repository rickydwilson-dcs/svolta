<!--
  Svolta Magic Link Email Template
  Paste this into: Supabase Dashboard → Authentication → Email Templates → Magic Link

  Subject line: Sign in to Svolta

  Brand colors:
    Orange: #F58529 | Pink: #DD2A7B | Purple: #8134AF | Blue: #515BD4
-->

<div style="background-color: #FAFAFA; padding: 40px 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #FFFFFF; border-radius: 16px; overflow: hidden; border: 1px solid #DBDBDB;">

    <!-- Gradient Header -->
    <div style="background: linear-gradient(135deg, #F58529, #DD2A7B, #8134AF, #515BD4); padding: 32px 24px; text-align: center;">
      <img src="https://www.svolta.app/svolta-logo.png" alt="Svolta" width="60" height="60" style="display: inline-block;" />
    </div>

    <!-- Body -->
    <div style="padding: 32px 24px;">

      <h1 style="font-size: 22px; font-weight: 600; color: #262626; text-align: center; margin: 0 0 8px 0;">
        Sign in to your account
      </h1>

      <p style="font-size: 15px; color: #8E8E8E; text-align: center; margin: 0 0 28px 0; line-height: 1.5;">
        Click the button below to securely sign in. This link expires in 10 minutes.
      </p>

      <!-- CTA Button with gradient -->
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="{{ .ConfirmationURL }}"
           style="display: inline-block; background: linear-gradient(135deg, #DD2A7B, #8134AF); color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600; padding: 14px 40px; border-radius: 10px;">
          Sign In
        </a>
      </div>

      <!-- Fallback link -->
      <p style="font-size: 13px; color: #8E8E8E; text-align: center; margin: 0 0 0 0; line-height: 1.5;">
        Or copy this link into your browser:<br />
        <a href="{{ .ConfirmationURL }}" style="color: #8134AF; word-break: break-all;">{{ .ConfirmationURL }}</a>
      </p>

    </div>

    <!-- Footer -->
    <div style="background-color: #FAFAFA; padding: 20px 24px; border-top: 1px solid #DBDBDB;">
      <p style="font-size: 12px; color: #8E8E8E; text-align: center; margin: 0; line-height: 1.5;">
        You received this because a sign-in was requested for this email on
        <a href="https://www.svolta.app" style="color: #DD2A7B; text-decoration: none;">svolta.app</a>.<br />
        If this wasn't you, safely ignore this email.
      </p>
    </div>

  </div>
</div>
